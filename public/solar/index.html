<meta charset="utf-8">
<title>궤도실험실 오르비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EDF0F6; --paper:#FFFFFF; --ink:#131C31; --ink-soft:#3D4761;
  --muted:#6E7791; --line:#D2D8E4; --line-soft:#E2E7F0;
  --amber:#C9631F; --amber-soft:#F6E7DA; --teal:#1F6B7A; --teal-soft:#DCEAED;
  --ok:#2C6E49; --ok-soft:#DCEBE2;
  --shadow:0 1px 2px rgba(19,28,49,.05), 0 10px 30px -20px rgba(19,28,49,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0D1220; --paper:#141B2C; --ink:#E7EBF4; --ink-soft:#B4BDD1;
  --muted:#8792AB; --line:#28324A; --line-soft:#1E273B;
  --amber:#F0A268; --amber-soft:#2E2216; --teal:#79C4D2; --teal-soft:#132A30;
  --ok:#7FCBA0; --ok-soft:#152A20;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --ground:#0D1220; --paper:#141B2C; --ink:#E7EBF4; --ink-soft:#B4BDD1;
  --muted:#8792AB; --line:#28324A; --line-soft:#1E273B;
  --amber:#F0A268; --amber-soft:#2E2216; --teal:#79C4D2; --teal-soft:#132A30;
  --ok:#7FCBA0; --ok-soft:#152A20;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.7;font-size:15px}
.app{max-width:1080px;margin:0 auto;padding:16px 20px 28px;display:flex;flex-direction:column;gap:13px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;justify-content:space-between;
  border-bottom:1px solid var(--line);padding-bottom:11px}
.brand h1{font-family:"Gowun Batang",serif;font-size:24px;margin:0;line-height:1.2}
.brand h1 em{font-style:normal;color:var(--amber)}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted);
  font-family:"IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
.themebtn{background:var(--paper);border:1px solid var(--line);color:var(--ink-soft);
  border-radius:2px;padding:7px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.themebtn:hover{border-color:var(--teal);color:var(--teal)}

/* mission tabs */
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs button{
  font:inherit;font-size:13px;padding:8px 13px;border-radius:2px;cursor:pointer;
  background:var(--paper);border:1px solid var(--line);color:var(--ink-soft);
  display:flex;align-items:center;gap:7px;transition:.15s}
nav.tabs button .n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
nav.tabs button[aria-selected="true"] .n{color:var(--ground);opacity:.65}
nav.tabs button[disabled]{opacity:.42;cursor:not-allowed}
nav.tabs button.done{border-color:var(--ok)}
nav.tabs button.done::after{content:"✓";color:var(--ok);font-size:12px}
nav.tabs button[aria-selected="true"].done::after{color:var(--ground)}

/* score bar */
.score{display:flex;flex-wrap:wrap;align-items:center;gap:14px;
  background:var(--paper);border:1px solid var(--line);border-radius:3px;
  padding:9px 14px;box-shadow:var(--shadow);position:relative}
.score .pts{display:flex;align-items:baseline;gap:6px}
.score .pts b{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.score .pts i{font-style:normal;font-size:11px;color:var(--muted);
  font-family:"IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
.score .lvl{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.score .lvl em{font-style:normal;font-weight:600;color:var(--amber)}
.gauge{flex:1 1 120px;min-width:90px;height:6px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .5s ease}
.badges{display:flex;gap:5px}
.badges span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:14px;border:1px solid var(--line);background:var(--ground);
  filter:grayscale(1);opacity:.35;transition:.3s}
.badges span.got{filter:none;opacity:1;border-color:var(--amber);background:var(--amber-soft);
  transform:scale(1.06)}
.pop{position:absolute;right:14px;top:-6px;font-size:14px;font-weight:600;color:var(--amber);
  pointer-events:none;opacity:0;font-variant-numeric:tabular-nums}
.pop.go{animation:rise 1.4s ease-out}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}18%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
@media (prefers-reduced-motion: reduce){.pop.go{animation:none;opacity:1}.gauge i{transition:none}}

/* brief */
.brief{background:var(--paper);border:1px solid var(--line);border-radius:3px;
  padding:13px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px}
.brief h2{font-family:"Gowun Batang",serif;font-size:19px;margin:0;line-height:1.3}
.brief p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.55;max-width:78ch}
.brief .goal{font-size:12.5px;color:var(--teal);font-family:"IBM Plex Mono",monospace;
  border-left:2px solid var(--teal);padding-left:9px;margin-top:3px}

/* panels */
.views{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.views.solo{grid-template-columns:1fr}
.views.solo .panel.sky{display:none}
.obody{display:flex;flex-direction:column;min-width:0}
.views.solo .obody{flex-direction:row;align-items:stretch}
.views.solo #orbit{width:auto;flex:1 1 0;min-width:0}
.views.solo .rail{flex:0 0 268px;width:268px;border-left:1px solid var(--line-soft);
  display:flex;flex-direction:column;overflow-y:auto}
.views.solo .rail .controls,.views.solo .rail .chips{border-top:0}
.views.solo .rail .chips{border-bottom:1px solid var(--line-soft);order:-1}
.views.solo .rail .readout{border-top:1px solid var(--line-soft);margin-top:auto}
@media (max-width:780px){.views{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:3px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:8px 13px;border-bottom:1px solid var(--line-soft)}
.panel-h b{font-size:12px;font-family:"IBM Plex Mono",monospace;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);font-weight:500}
.panel-h .hint{font-size:12px;color:var(--muted)}
canvas{display:block;width:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
canvas:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:7px;padding:10px 13px;border-top:1px solid var(--line-soft)}
button.ctl{font:inherit;font-size:13px;padding:7px 12px;border-radius:2px;cursor:pointer;
  background:var(--ground);border:1px solid var(--line);color:var(--ink)}
button.ctl:hover{border-color:var(--teal);color:var(--teal)}
button.ctl.primary{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);font-weight:500}
button.ctl[disabled]{opacity:.4;cursor:not-allowed}
button.ctl:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* readouts */
.readout{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line-soft)}
.readout div{flex:1 1 92px;padding:7px 13px;border-right:1px solid var(--line-soft)}
.readout div:last-child{border-right:0}
.readout dt{margin:0;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.readout dd{margin:0;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}

/* planet chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 13px;border-top:1px solid var(--line-soft)}
.chip{font:inherit;font-size:13px;padding:6px 11px;border-radius:20px;cursor:pointer;
  background:var(--ground);border:1px solid var(--line);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"],
:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#1B1206}
.chip.placed{opacity:.35;text-decoration:line-through;cursor:not-allowed}

/* log */
.logbook{background:var(--paper);border:1px solid var(--line);border-radius:3px;
  box-shadow:var(--shadow);padding:12px 16px}
.logbook h3{margin:0 0 7px;font-size:12px;font-family:"IBM Plex Mono",monospace;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.entries{display:flex;flex-wrap:wrap;gap:8px;min-height:34px}
.entry{border:1px solid var(--line);border-radius:2px;padding:6px 11px;font-size:13px;
  background:var(--ground);display:flex;gap:8px;align-items:baseline}
.entry b{font-weight:600}
.entry span{color:var(--muted);font-size:12px;font-family:"IBM Plex Mono",monospace}
.empty{color:var(--muted);font-size:13.5px}

/* 수료증 */
.cert{background:var(--paper);border:1px solid var(--line);border-radius:3px;
  box-shadow:var(--shadow);padding:0;overflow:hidden}
.cert-inner{padding:34px 38px 26px;border:2px solid var(--amber);margin:12px;
  border-radius:2px;position:relative;
  background:
    radial-gradient(circle at 12% 8%, rgba(201,99,31,.06), transparent 42%),
    radial-gradient(circle at 88% 92%, rgba(31,107,122,.06), transparent 42%),
    var(--paper)}
.cert-inner::after{content:"";position:absolute;inset:5px;border:1px solid var(--line);
  border-radius:2px;pointer-events:none}
.cert-eyebrow{margin:0 0 6px;font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--amber);text-align:center}
.cert h2{font-family:"Gowun Batang",serif;font-size:31px;margin:0 0 14px;text-align:center;
  letter-spacing:.14em}
.cert-lead{margin:0 auto 22px;text-align:center;color:var(--ink-soft);font-size:14px;
  line-height:1.85;max-width:46ch}
.cert-name{display:flex;align-items:baseline;justify-content:center;gap:14px;margin-bottom:22px}
.cert-name span{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted)}
.cert-name input{font:inherit;font-family:"Gowun Batang",serif;font-size:30px;font-weight:700;
  color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--line);
  padding:2px 14px 6px;text-align:center;width:min(340px,60%);outline:none}
.cert-name input::placeholder{color:var(--line);font-size:20px;font-weight:400}
.cert-name input:focus{border-bottom-color:var(--amber)}
.cert-badges{display:flex;justify-content:center;gap:9px;margin-bottom:20px;flex-wrap:wrap}
.cert-badges span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  font-size:19px;border:1px solid var(--amber);background:var(--amber-soft)}
.cert-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:0;margin:0 0 24px;
  border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.cert-stats div{flex:1 1 110px;padding:11px 14px;text-align:center;
  border-right:1px solid var(--line-soft)}
.cert-stats div:last-child{border-right:0}
.cert-stats dt{margin:0 0 2px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cert-stats dd{margin:0;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.cert-foot{display:flex;align-items:center;justify-content:space-between;gap:16px}
.cert-foot .issued{font-size:13.5px;color:var(--ink-soft)}
.cert-foot .issued b{display:block;font-family:"Gowun Batang",serif;font-size:16px;
  font-weight:700;color:var(--ink);margin-top:2px}
.seal{width:74px;height:74px;border-radius:50%;border:2px solid var(--amber);
  color:var(--amber);display:grid;place-items:center;text-align:center;line-height:1.25;
  font-family:"Gowun Batang",serif;font-size:13px;font-weight:700;letter-spacing:.06em;
  transform:rotate(-8deg);background:var(--amber-soft)}
.cert-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 20px 16px;border-top:1px solid var(--line-soft)}
.cert-hint{font-size:13px;color:var(--muted)}
@media print{
  .app>*{display:none!important}
  .app>.cert{display:block!important;box-shadow:none;border:0}
  .cert-actions{display:none!important}
  body,.cert,.cert-inner{background:#fff!important;color:#131C31!important}
}

/* feedback */
.fb{margin-top:10px;padding:9px 13px;border-radius:2px;font-size:14px;border:1px solid var(--line);
  background:var(--ground);color:var(--ink-soft)}
.fb.warn{background:var(--amber-soft);border-color:var(--amber);color:var(--ink)}
.fb.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
footer{color:var(--muted);font-size:11.5px;font-family:"IBM Plex Mono",monospace;
  letter-spacing:.05em;border-top:1px solid var(--line);padding-top:11px;margin:0}
</style>

<div class="app">
  <div class="top">
    <div class="brand">
      <h1>궤도실험실 <em>오르비</em></h1>
      <p>관측 기지 · 임무 6</p>
    </div>
    <button class="themebtn" id="theme">테마 전환</button>
  </div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="임무 선택"></nav>

  <div class="score" id="score"></div>

  <div class="brief">
    <h2 id="mTitle"></h2>
    <p id="mDesc"></p>
    <p class="goal" id="mGoal"></p>
  </div>

  <div class="views" id="views">
    <div class="panel" id="orbitPanel">
      <div class="panel-h"><b>궤도판 · 우주에서 본 시점</b><span class="hint" id="orbitHint"></span></div>
      <div class="obody" id="obody">
        <canvas id="orbit" tabindex="0" aria-label="궤도판. 방향키로 천체를 움직일 수 있습니다."></canvas>
        <div class="rail" id="rail">
          <div class="controls" id="orbitCtl"></div>
        </div>
      </div>
    </div>
    <div class="panel sky" id="skyPanel">
      <div class="panel-h"><b>하늘창 · 땅에서 본 시점</b><span class="hint" id="skyHint">관측 지점의 남쪽 하늘</span></div>
      <canvas id="sky" tabindex="-1" aria-hidden="true"></canvas>
      <dl class="readout" id="readout"></dl>
    </div>
  </div>

  <div class="logbook">
    <h3>관측 일지</h3>
    <div class="entries" id="entries"><span class="empty">아직 기록이 없습니다.</span></div>
    <div class="fb" id="fb">궤도판을 움직이면 하늘창이 즉시 따라 바뀝니다. 무엇이 달라지는지 살펴보세요.</div>
  </div>

  <section class="cert" id="cert" hidden aria-label="관측 수료증">
    <div class="cert-inner">
      <p class="cert-eyebrow">궤도실험실 오르비 · 관측 기지</p>
      <h2>관측 수료증</h2>
      <p class="cert-lead">아래 사람은 여섯 개의 관측 임무를 모두 마치고,<br>
        태양계와 지구·달의 운동을 스스로 확인하였기에 이 증서를 드립니다.</p>
      <label class="cert-name">
        <span>이름</span>
        <input id="certName" type="text" placeholder="이름을 입력하세요" maxlength="18" autocomplete="off">
      </label>
      <div class="cert-badges" id="certBadges"></div>
      <dl class="cert-stats" id="certStats"></dl>
      <div class="cert-foot">
        <span class="issued">발급일<b id="certDate"></b></span>
        <span class="seal">관측<br>기지</span>
      </div>
    </div>
    <div class="cert-actions">
      <button class="ctl primary" id="certPrint">🖨 인쇄 · PDF로 저장</button>
      <span class="cert-hint">화면을 그대로 캡처해 보관해도 좋습니다.</span>
    </div>
  </section>

  <p class="sr" role="status" aria-live="polite" id="live"></p>
  <footer>궤도실험실 오르비 · 프로토타입 v1 · 초등학교 과학</footer>
</div>

<script>
"use strict";
const TAU=Math.PI*2, D2R=Math.PI/180, R2D=180/Math.PI;
const norm=a=>((a%360)+360)%360;                 // 0..360
const sgn=a=>{a=norm(a); return a>180?a-360:a;}; // -180..180
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const $=id=>document.getElementById(id);

/* ---------------- 세계 모형 ----------------
   태양 원점. 북극에서 내려다본 평면. 반시계 방향이 실제 자전·공전 방향.
   thE 지구 공전각 / phi 관측자의 절대 방향(자전) / thM 달의 공전각        */
const S={m:1, thE:0, phi:180, thM:40, scale:'diagram',
  done:{1:false,2:false,3:false,4:false,5:false},
  slots:{}, pick:null, log:[], spinNet:0, seen:{}, warned:false,
  guide:{d:false,c:false,dOK:false,cOK:false}, starIdx:0, starFocus:false,
  score:0, badges:{}, clean:{}, classify:false, moonZoom:false, records:0, name:''};

const PLANETS=[
  {k:'수성',au:0.39,rel:0.38,c:'#9A8F84',t:'지구형',ring:0,
   d:'단단한 암석 표면. 태양에 가장 가깝고 태양계에서 가장 작습니다. 공기가 거의 없어 낮과 밤의 온도 차가 아주 큽니다.'},
  {k:'금성',au:0.72,rel:0.95,c:'#D8B26A',t:'지구형',ring:0,
   d:'단단한 암석 표면. 크기는 지구와 비슷하지만 두꺼운 이산화탄소 대기에 덮여 태양계에서 가장 뜨겁습니다.'},
  {k:'지구',au:1.00,rel:1.00,c:'#3E7FB8',t:'지구형',ring:0,
   d:'단단한 암석 표면. 액체 상태의 물과 생명이 있는, 지금까지 알려진 유일한 행성입니다.'},
  {k:'화성',au:1.52,rel:0.53,c:'#B25B3C',t:'지구형',ring:0,
   d:'단단한 암석 표면. 지구의 절반쯤 되는 크기이고, 산화철 때문에 표면이 붉게 보입니다.'},
  {k:'목성',au:5.20,rel:11.2,c:'#C79A6B',t:'목성형',ring:1,

  {k:'토성',au:9.58,rel:9.45,c:'#D6BE86',t:'목성형',ring:2,
   d:'가스 행성. 얼음과 돌 조각으로 된 뚜렷한 고리로 유명합니다. 크기에 비해 아주 가벼워서, 물에 넣으면 뜰 정도입니다.'},
  {k:'천왕성',au:19.2,rel:4.01,c:'#7FBFC4',t:'목성형',ring:1,
   d:'가스 행성. 거의 옆으로 누운 채 자전하는 것이 특징이고, 희미한 고리가 있습니다.'},
  {k:'해왕성',au:30.1,rel:3.88,c:'#4A6FB5',t:'목성형',ring:1,

const pimg={};
for(const k in PLANET_IMG){const im=new Image(); im.onload=()=>draw(); im.src=PLANET_IMG[k].src; pimg[k]=im;}
function spriteReady(k){const im=pimg[k]; return !!(im&&im.complete&&im.naturalWidth);}
function planetSprite(k,x,y,pr){
  if(!spriteReady(k)) return false;
  const meta=PLANET_IMG[k], im=pimg[k], side=2*pr/meta.globe;
  if(meta.globe>0.99){                       // 둥근 행성 — 원으로 오려 그린다
    ox.save(); ox.beginPath(); ox.arc(x,y,pr,0,TAU); ox.clip();
    ox.drawImage(im,x-side/2,y-side/2,side,side); ox.restore();
  }else{                                     // 토성 — 고리까지 그대로
    ox.drawImage(im,x-side/2,y-side/2,side,side);
  }
  return true;

function inBand(i,e){ return i===4 ? Math.abs(e)>=168 : (e>=PHASES[i].lo && e<=PHASES[i].hi); }
function bandGap(i,e){ return i===4 ? 180-Math.abs(e) : Math.abs(sgn(PHASES[i].mid-e)); }

/* 파생값 */
function sunDirFromEarth(){return norm(S.thE+180);}          // 지구→태양 방향
function moonDirFromEarth(){return norm(S.thM);}             // 지구→달 방향
function relAngle(worldDir){return sgn(worldDir-S.phi);}     // 관측자 기준 (+동 ~ -서)
function hourOf(){const a=relAngle(sunDirFromEarth()); return ((12-a/15)%24+24)%24;}
function elong(){return sgn(moonDirFromEarth()-sunDirFromEarth());}  // 이각 −180~180
function moonK(){return (1-Math.cos(elong()*D2R))/2;}
function setHour(h){S.phi=norm(sunDirFromEarth()-(12-h)*15);}
function hhmm(h){const m=Math.round(h*60);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function conAngle(s){return norm(s.deg-45);}   // 그 계절 저녁 9시에 남중
function seasonNow(){let best=SEASONS[0],d=999;for(const s of SEASONS){const t=Math.abs(sgn(s.deg-S.thE));if(t<d){d=t;best=s;}}return best;}
function phaseName(){
  const e=elong();
  for(let i=0;i<8;i++) if(inBand(i,e)) return PHASES[i].n;
  let best=0,d=1e9;
  for(let i=0;i<8;i++){const t=bandGap(i,e); if(t<d){d=t;best=i;}}
  return PHASES[best].n+' 근처';}

  d:'태양·지구·달이 일직선이 될 때 식이 일어납니다. 달을 움직여 일식과 월식을 각각 재현하세요. 그리고 생각해 보세요 — 왜 매달 일어나지 않을까요?',
  g:'목표 — 일식과 월식을 각각 한 번씩 재현하기'}};

/* ---------------- 캔버스 ---------------- */
const oc=$('orbit'), sc=$('sky');
const ox=oc.getContext('2d'), sx=sc.getContext('2d');
let OW=0,OH=0,SW=0,SH=0;
function fit(){
  const dpr=Math.min(devicePixelRatio||1,2);
  for(const [cv,cx,set] of [[oc,ox,'o'],[sc,sx,'s']]){
    const solo=(S.m===1&&set==='o');
    const w=cv.clientWidth||420,
      h=Math.round(clamp(w*(solo?0.62:0.70),190,solo?430:330));
    cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+'px';
    cx.setTransform(dpr,0,0,dpr,0,0);
    if(set==='o'){OW=w;OH=h;}else{SW=w;SH=h;}
  }
  draw();
}
addEventListener('resize',fit);

const SPACE='#0A0F1C', SPACE2='#141C31';
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

/* ---- 궤도판 ---- */
function drawOrbit(){
  ox.fillStyle=SPACE; ox.fillRect(0,0,OW,OH);
  if(S.m===1) drawSystem(); else if(S.m===2||S.m===3||S.m===6) drawEarthOrbit(); else drawEarthMoon();
}

/* ---- 입체 궤도판 : 평면을 눕혀 본 축측 투영 ---- */
const TILT=0.46;                                  // 작업평면을 눕히는 비율
function shade(hex,f){
  const q=i=>parseInt(hex.substr(i,2),16);
  let r=q(1),g=q(3),b=q(5);
  if(f>0){r+=(255-r)*f; g+=(255-g)*f; b+=(255-b)*f;} else {r*=1+f; g*=1+f; b*=1+f;}
  return 'rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')';
}
function ellipse(cx,cy,r,ry){ox.beginPath();ox.ellipse(cx,cy,r,ry,0,0,TAU);}
function sphere3d(x,y,r,col){
  const g=ox.createRadialGradient(x-r*0.38,y-r*0.42,r*0.06,x,y,r*1.08);
  g.addColorStop(0,shade(col,0.62)); g.addColorStop(0.45,col); g.addColorStop(1,shade(col,-0.60));
  ox.fillStyle=g; ox.beginPath(); ox.arc(x,y,r,0,TAU); ox.fill();
  const h=ox.createRadialGradient(x-r*0.4,y-r*0.46,0,x-r*0.4,y-r*0.46,r*0.75);
  h.addColorStop(0,'rgba(255,255,255,.34)'); h.addColorStop(1,'rgba(255,255,255,0)');
  ox.fillStyle=h; ox.beginPath(); ox.arc(x,y,r,0,TAU); ox.fill();
}
function contact(x,y,r){                          // 작업평면에 닿는 그림자
  ox.save(); ox.translate(x,y); ox.scale(1,0.42);
  const g=ox.createRadialGradient(0,0,0,0,0,r*1.7);
  g.addColorStop(0,'rgba(3,6,14,.62)'); g.addColorStop(1,'rgba(3,6,14,0)');
  ox.fillStyle=g; ox.beginPath(); ox.arc(0,0,r*1.7,0,TAU); ox.fill(); ox.restore();
}
function workplane(cx,cy,R){                      // 눕힌 격자판
  ox.save();
  ellipse(cx,cy,R*1.10,R*1.10*TILT); ox.clip();
  const g=ox.createRadialGradient(cx,cy,0,cx,cy,R*1.1);
  g.addColorStop(0,'rgba(38,54,88,.42)'); g.addColorStop(1,'rgba(24,34,58,.06)');
  ox.fillStyle=g; ox.fillRect(cx-R*1.2,cy-R*1.2,R*2.4,R*2.4);
  const G=R/6;
  ox.strokeStyle='rgba(150,180,225,.13)'; ox.lineWidth=1;
  for(let k=-7;k<=7;k++){
    ox.beginPath(); ox.moveTo(cx+k*G,cy-R*1.2); ox.lineTo(cx+k*G,cy+R*1.2); ox.stroke();
    ox.beginPath(); ox.moveTo(cx-R*1.2,cy+k*G*TILT); ox.lineTo(cx+R*1.2,cy+k*G*TILT); ox.stroke();
  }
  ox.restore();
  ox.strokeStyle='rgba(150,180,225,.22)'; ox.lineWidth=1;
  ellipse(cx,cy,R*1.10,R*1.10*TILT); ox.stroke();
}

function drawSystem(){
  const cx=OW*0.5, cy=OH*0.54, real=S.scale==='real';
  const Rmax=Math.min(OW*0.44, OH*0.40/TILT);
  const pxAU=(Rmax-26)/19.2;                      // 천왕성이 가장자리에 닿는 배율
  const rings=PLANETS.map((p,i)=> real ? 26+p.au*pxAU : 40+i*(Rmax-40)/7.4);
  workplane(cx,cy,Rmax);

  PLANETS.forEach((p,i)=>{                        // 궤도
    const r=rings[i], placed=S.slots[i];
    ox.strokeStyle= placed?'rgba(160,188,228,.42)':'rgba(150,175,215,.18)';
    ox.setLineDash(placed?[]:[3,5]); ox.lineWidth=1;
    ellipse(cx,cy,r,r*TILT); ox.stroke(); ox.setLineDash([]);
  });
  if(S.classify){                                 // 지구형 · 목성형 경계
    const rb=(rings[3]+rings[4])/2;
    ox.strokeStyle='rgba(220,230,250,.34)'; ox.lineWidth=1; ox.setLineDash([2,5]);
    ellipse(cx,cy,rb,rb*TILT); ox.stroke(); ox.setLineDash([]);
  }

  const sr=real?15:17;                            // 태양
  const sg=ox.createRadialGradient(cx,cy,1,cx,cy,sr*4);
  sg.addColorStop(0,'rgba(255,226,150,.95)'); sg.addColorStop(.3,'rgba(244,160,60,.4)');
  sg.addColorStop(1,'rgba(244,160,60,0)');
  ox.fillStyle=sg; ox.beginPath(); ox.arc(cx,cy,sr*4,0,TAU); ox.fill();
  sphere3d(cx,cy,sr,'#F5A623');

  const items=[];                                 // 행성 — 깊이 순으로 정렬
  PLANETS.forEach((p,i)=>{
    const r=rings[i], a=(-40+i*137.5)*D2R;   // 황금각 — 눕힌 평면에서도 고르게 흩어진다
    const bx=cx+r*Math.cos(a), by=cy+r*TILT*Math.sin(a);
    items.push({i,p,r,bx,by,placed:S.slots[i]});
  });
  items.sort((a,b)=>a.by-b.by);

  items.forEach(({i,p,bx,by,placed})=>{
    if(placed){
      const pl=PLANETS.find(q=>q.k===placed);
      const pr= real ? clamp(2.6*Math.pow(pl.rel,0.6),3.2,26) : clamp(8+i*1.7,8,21);
      const lift=pr*1.15, sx0=bx, sy0=by-lift;
      contact(bx,by,pr);
      ox.strokeStyle='rgba(160,190,230,.30)'; ox.lineWidth=1;   // 받침대
      ox.beginPath(); ox.moveTo(bx,by); ox.lineTo(sx0,sy0+pr*0.7); ox.stroke();
      const realRing = pl.ring===2 && spriteReady(pl.k);          // 사진에 고리가 들어 있다
      if(pl.ring && !realRing){                                  // 고리 — 뒤쪽 반
        const rr=pr*(pl.ring===2?2.1:1.42), ry=rr*0.30;
        ox.strokeStyle= pl.ring===2?'rgba(236,220,178,.9)':'rgba(190,205,230,.28)';
        ox.lineWidth= pl.ring===2?3:1;
        ox.beginPath(); ox.ellipse(sx0,sy0,rr,ry,0,Math.PI,TAU); ox.stroke();
        if(pl.ring===2){ox.strokeStyle='rgba(236,220,178,.45)';ox.lineWidth=1.4;
          ox.beginPath(); ox.ellipse(sx0,sy0,rr*1.25,ry*1.25,0,Math.PI,TAU); ox.stroke();}
      }
      if(!planetSprite(pl.k,sx0,sy0,pr)) sphere3d(sx0,sy0,pr,pl.c);
      if(pl.ring && !realRing){                                  // 고리 — 앞쪽 반
        const rr=pr*(pl.ring===2?2.1:1.42), ry=rr*0.30;
        ox.strokeStyle= pl.ring===2?'rgba(246,232,196,.95)':'rgba(200,215,240,.36)';
        ox.lineWidth= pl.ring===2?3:1;
        ox.beginPath(); ox.ellipse(sx0,sy0,rr,ry,0,0,Math.PI); ox.stroke();
        if(pl.ring===2){ox.strokeStyle='rgba(246,232,196,.5)';ox.lineWidth=1.4;
          ox.beginPath(); ox.ellipse(sx0,sy0,rr*1.25,ry*1.25,0,0,Math.PI); ox.stroke();}
      }
      if(S.classify){
        ox.strokeStyle= pl.t==='지구형'?'#F0A268':'#79C4D2'; ox.lineWidth=2;
        ox.setLineDash([4,3]);
        ox.beginPath(); ox.arc(sx0,sy0,pr+5.5,0,TAU); ox.stroke();
        ox.setLineDash([]);
      }
      if(!(real&&i<4)){                                  // 실제 비율에선 안쪽 넷을 묶어 표시
        ox.fillStyle= placed===p.k?'rgba(224,234,250,.95)':'#F0A268';
        ox.font='500 12px "IBM Plex Sans KR",sans-serif'; ox.textAlign='center';
        const up=(i%2===0);                              // 위·아래 번갈아 — 이름표 겹침 방지
        ox.fillText(placed,sx0, up ? sy0-pr-10 : sy0+pr+18);
      }
      if(placed!==p.k){ox.strokeStyle='#F0A268';ox.lineWidth=1.8;
        ox.beginPath();ox.arc(sx0,sy0,pr+7,0,TAU);ox.stroke();}
    }else if(S.pick){                                            // 빈 궤도 표시
      ox.fillStyle='rgba(121,196,210,.9)'; ox.beginPath(); ox.arc(bx,by,5,0,TAU); ox.fill();
      ox.strokeStyle='rgba(121,196,210,.55)'; ox.lineWidth=1.2;
      ox.beginPath(); ox.arc(bx,by,10,0,TAU); ox.stroke();
    }
  });

  if(real && PLANETS.slice(0,4).every((q,i)=>S.slots[i])){   // 안쪽 넷 묶음 지시선
    const r4=rings[3], ax=cx+r4*0.72, ay=cy+r4*TILT*0.72+16;
    ox.strokeStyle='rgba(224,234,250,.5)'; ox.lineWidth=1;
    ox.beginPath(); ox.moveTo(ax,ay); ox.lineTo(ax+34,ay+26); ox.lineTo(ax+150,ay+26); ox.stroke();
    ox.fillStyle='rgba(224,234,250,.9)'; ox.font='500 12px "IBM Plex Sans KR",sans-serif';
    ox.textAlign='left'; ox.textBaseline='bottom';
    ox.fillText('수성·금성·지구·화성',ax+38,ay+23);
    ox.fillStyle='rgba(170,190,220,.7)'; ox.font='400 11px "IBM Plex Sans KR",sans-serif';
    ox.textBaseline='top'; ox.fillText('네 행성이 이 좁은 범위에 모두 들어 있습니다',ax+38,ay+29);
  }
  if(S.classify){                                            // 범례 — 왼쪽 위 고정
    ox.textAlign='left'; ox.textBaseline='middle';
    ox.font='500 11.5px "IBM Plex Sans KR",sans-serif';
    [['#F0A268','지구형 · 단단한 표면',18],['#79C4D2','목성형 · 가스, 고리',40]].forEach(([c,t,y])=>{
      ox.fillStyle=c; ox.beginPath(); ox.arc(20,y,5,0,TAU); ox.fill();
      ox.fillStyle=c; ox.fillText(t,32,y);
    });
  }
  ox.textAlign='left'; ox.textBaseline='alphabetic';
  ox.font='400 11px "IBM Plex Mono",monospace'; ox.fillStyle='rgba(170,190,220,.7)';
  ox.fillText(real?'실제 거리 비율 · 화면 밖으로 벗어난 행성이 있습니다':'교과서 그림 비율',12,OH-12);
  if(S.pick){ox.fillStyle='#79C4D2';ox.textAlign='right';
    ox.fillText('「'+S.pick+'」 놓을 궤도를 누르세요',OW-12,OH-12);}
  window.__rings={cx,cy,rings};
}

function drawEarthOrbit(){
  const cx=OW*0.5, cy=OH*0.54, R=Math.min(OW*0.29, OH*0.30/TILT);
  starsBG();
  workplane(cx,cy,R*1.22);

  SEASONS.forEach(s=>{                                   // 계절 별자리 표지
    const a=conAngle(s)*D2R, r=R*1.55;
    const x=cx+r*Math.cos(a), y=cy-r*TILT*Math.sin(a);
    const now = S.m===3 && Math.abs(sgn(s.deg-S.thE))<14;
    for(let i=0;i<4;i++){const q=a+(i-1.5)*0.06, rr=r-16-i*4;
      ox.fillStyle= now?'rgba(240,162,104,.95)':'rgba(190,205,230,.45)';
      ox.beginPath();ox.arc(cx+rr*Math.cos(q),cy-rr*TILT*Math.sin(q),1.6,0,TAU);ox.fill();}
    ox.fillStyle= now?'#F0A268':'rgba(160,180,215,.55)';
    ox.font=(now?'500 ':'400 ')+'11px "IBM Plex Sans KR",sans-serif';
    ox.textAlign= x<cx?'left':'right'; ox.textBaseline='middle';
    ox.fillText(s.c, clamp(x,10,OW-10), clamp(y,12,OH-14));
  });
  ox.textAlign='left'; ox.textBaseline='alphabetic';

  ox.strokeStyle='rgba(160,188,228,.34)';ox.lineWidth=1;ox.setLineDash([4,6]);
  ellipse(cx,cy,R,R*TILT);ox.stroke();ox.setLineDash([]);

  if(S.m===3) SEASONS.forEach(s=>{                       // 네 지점 표시
    const a=s.deg*D2R, x=cx+R*Math.cos(a), y=cy-R*TILT*Math.sin(a);
    ox.strokeStyle= S.seen[s.s]?'rgba(127,203,160,.95)':'rgba(150,175,215,.55)';
    ox.lineWidth=1.4; ox.beginPath(); ox.ellipse(x,y,15,15*TILT+3,0,0,TAU); ox.stroke();
    ox.fillStyle= S.seen[s.s]?'rgba(127,203,160,.9)':'rgba(150,175,215,.6)';
    ox.font='500 10.5px "IBM Plex Sans KR",sans-serif'; ox.textAlign='center';
    ox.fillText(s.s, x, y+22);
  });
  ox.textAlign='left';

  const sg=ox.createRadialGradient(cx,cy,1,cx,cy,54);    // 태양
  sg.addColorStop(0,'rgba(255,226,150,.95)');sg.addColorStop(.3,'rgba(244,160,60,.42)');
  sg.addColorStop(1,'rgba(244,160,60,0)');
  ox.fillStyle=sg;ox.beginPath();ox.arc(cx,cy,54,0,TAU);ox.fill();
  sphere3d(cx,cy,14,'#F5A623');

  const ex=cx+R*Math.cos(S.thE*D2R), ey=cy-R*TILT*Math.sin(S.thE*D2R);
  contact(ex,ey+13,19); earth(ex,ey,19,true);

  if(S.m===6){
    ox.fillStyle='rgba(240,162,104,.85)';ox.font='500 11px "IBM Plex Sans KR",sans-serif';
    ox.textAlign='left';ox.fillText('⭐ 북극성은 자전축 방향 — 이 화면의 위쪽',12,OH-12);
  }
  window.__eo={cx,cy,R,ex,ey};
}

function drawEarthMoon(){
  const cx=OW*0.5, cy=OH*0.54, R=Math.min(OW*0.29, OH*0.30/TILT);
  starsBG();
  const sd=sunDirFromEarth()*D2R;
  const gr=ox.createLinearGradient(cx+Math.cos(sd)*OW*0.5, cy-Math.sin(sd)*TILT*OW*0.5,
                                   cx-Math.cos(sd)*OW*0.5, cy+Math.sin(sd)*TILT*OW*0.5);
  gr.addColorStop(0,'rgba(255,205,120,.20)');gr.addColorStop(1,'rgba(255,205,120,0)');
  ox.fillStyle=gr; ox.fillRect(0,0,OW,OH);
  workplane(cx,cy,R*1.22);

  for(let i=-3;i<=3;i++){                                 // 햇빛
    const off=i*24;
    const px=cx+Math.cos(sd)*R*2.0 - Math.sin(sd)*off, py=cy-Math.sin(sd)*TILT*R*2.0 - Math.cos(sd)*off*TILT;
    ox.strokeStyle='rgba(255,205,120,.3)';ox.lineWidth=1;ox.beginPath();
    ox.moveTo(px,py);ox.lineTo(px-Math.cos(sd)*48,py+Math.sin(sd)*TILT*48);ox.stroke();
  }
  ox.fillStyle='#FFC24D';ox.font='500 11px "IBM Plex Sans KR",sans-serif';
  ox.textAlign='center';ox.textBaseline='middle';
  ox.fillText('☀ 태양 방향',clamp(cx+Math.cos(sd)*R*2.3,54,OW-54),
                            clamp(cy-Math.sin(sd)*TILT*R*2.3,14,OH-14));
  ox.textAlign='left';ox.textBaseline='alphabetic';

  if(S.m===5){                                            // 지구 그림자
    const ad=sd+Math.PI, ux=Math.cos(ad), uy=-Math.sin(ad)*TILT;
    const nx=-uy, ny=ux;
    ox.fillStyle='rgba(8,12,24,.85)';ox.beginPath();
    ox.moveTo(cx+nx*15,cy+ny*15);
    ox.lineTo(cx+ux*R*1.7+nx*7,cy+uy*R*1.7+ny*7);
    ox.lineTo(cx+ux*R*1.7-nx*7,cy+uy*R*1.7-ny*7);
    ox.lineTo(cx-nx*15,cy-ny*15);ox.closePath();ox.fill();
  }

  ox.strokeStyle='rgba(160,188,228,.34)';ox.lineWidth=1;ox.setLineDash([4,6]);
  ellipse(cx,cy,R,R*TILT);ox.stroke();ox.setLineDash([]);

  contact(cx,cy+15,22); earth(cx,cy,22,true);

  const mx=cx+R*Math.cos(S.thM*D2R), my=cy-R*TILT*Math.sin(S.thM*D2R);
  contact(mx,my+7,9);
  ox.fillStyle='#3A4155';ox.beginPath();ox.arc(mx,my,9,0,TAU);ox.fill();
  ox.fillStyle='#E8E4DA';ox.beginPath();ox.arc(mx,my,9,-sd-Math.PI/2,-sd+Math.PI/2);ox.fill();
  ox.strokeStyle='rgba(220,228,245,.55)';ox.lineWidth=1;
  ox.beginPath();ox.ellipse(mx,my,14,14*TILT+3,0,0,TAU);ox.stroke();
  window.__em={cx,cy,R,mx,my};
}

function starsBG(cx,cy,R){
  if(!window.__stars){window.__stars=[];for(let i=0;i<90;i++)window.__stars.push([Math.random(),Math.random(),Math.random()*1.1+.3]);}
  for(const [a,b,r] of window.__stars){
    ox.fillStyle='rgba(200,215,240,'+(0.12+r*0.22)+')';
    ox.beginPath();ox.arc(a*OW,b*OH,r*0.8,0,TAU);ox.fill();}
}
function sun(x,y,r){
  const g=ox.createRadialGradient(x,y,1,x,y,r*3.6);
  g.addColorStop(0,'#FFD27A');g.addColorStop(.32,'rgba(240,150,50,.4)');g.addColorStop(1,'rgba(240,150,50,0)');
  ox.fillStyle=g;ox.beginPath();ox.arc(x,y,r*3.6,0,TAU);ox.fill();
  ox.fillStyle='#FFC24D';ox.beginPath();ox.arc(x,y,r,0,TAU);ox.fill();
}
function earth(x,y,r,showFlag){
  const sd=sunDirFromEarth()*D2R;
  if(spriteReady('지구')){
    ox.save(); ox.beginPath(); ox.arc(x,y,r,0,TAU); ox.clip();
    ox.translate(x,y); ox.rotate(-S.phi*D2R);            // 자전에 따라 돌아간다
    ox.drawImage(pimg['지구'],-r,-r,r*2,r*2); ox.restore();
    ox.fillStyle='rgba(5,9,20,.72)';                     // 밤 반구
    ox.beginPath();ox.arc(x,y,r,-sd+Math.PI/2,-sd+Math.PI*1.5);ox.fill();
  }else{
    ox.fillStyle='#16233A';ox.beginPath();ox.arc(x,y,r,0,TAU);ox.fill();       // 밤
    ox.fillStyle='#3E7FB8';ox.beginPath();ox.arc(x,y,r,-sd-Math.PI/2,-sd+Math.PI/2);ox.fill(); // 낮
    ox.fillStyle='rgba(120,180,130,.5)';
    for(let i=0;i<3;i++){const a=S.phi*D2R+i*2.1;
      ox.beginPath();ox.arc(x+r*0.45*Math.cos(a),y-r*0.45*Math.sin(a),r*0.26,0,TAU);ox.fill();}
  }
  ox.strokeStyle='rgba(220,230,250,.35)';ox.lineWidth=1;ox.beginPath();ox.arc(x,y,r,0,TAU);ox.stroke();
  // 자전 방향 화살
  ox.strokeStyle='rgba(121,196,210,.85)';ox.lineWidth=1.6;
  ox.beginPath();ox.arc(x,y,r+7,-2.5,-0.9);ox.stroke();
  const ta=-0.9, tx=x+(r+7)*Math.cos(ta), ty=y+(r+7)*Math.sin(ta);
  ox.fillStyle='rgba(121,196,210,.85)';ox.beginPath();
  ox.moveTo(tx,ty);ox.lineTo(tx-5,ty-5);ox.lineTo(tx+2,ty-7);ox.closePath();ox.fill();
  if(showFlag){ // 관측 지점
    const a=S.phi*D2R, fx=x+r*Math.cos(a), fy=y-r*Math.sin(a);
    ox.strokeStyle='#F0A268';ox.lineWidth=1.6;ox.beginPath();
    ox.moveTo(fx,fy);ox.lineTo(fx+9*Math.cos(a),fy-9*Math.sin(a));ox.stroke();
    ox.fillStyle='#F0A268';ox.beginPath();ox.arc(fx+11*Math.cos(a),fy-11*Math.sin(a),3.4,0,TAU);ox.fill();
  }
}

/* ---- 하늘창 ---- */
function drawSky(){
  if(S.m===6){drawNorthSky();return;}
  if(S.m===4&&S.moonZoom){drawMoonZoom();return;}
  const hz=SH*0.72, alt=90-Math.abs(relAngle(sunDirFromEarth()));
  const t=clamp((alt+12)/40,0,1); // 0 밤 → 1 낮

function northGeom(){
  const hz=SH*0.86, P={x:SW*0.5,y:SH*0.40}, k=(hz-P.y)/6.9, th=S.phi*D2R;
  const T=(x,y)=>({x:P.x+k*(x*Math.cos(th)+y*Math.sin(th)),
                   y:P.y+k*(-x*Math.sin(th)+y*Math.cos(th))});
  return {hz,P,k,T};
}
function northStars(){
  const list=[{n:'북극성',x:0,y:0,pole:true}];
  DIPPER.forEach(([n,x,y])=>list.push({n,x,y,grp:'d'}));
  CAS.forEach(([n,x,y])=>list.push({n,x,y,grp:'c'}));
  return list;
}

  sx.setLineDash([]);

  sx.fillStyle='#131A1B';sx.fillRect(0,hz,SW,SH-hz);

function pickStar(px,py){
  const {T}=northGeom(), stars=northStars();
  let best=-1,d=1e9;
  stars.forEach((st,i)=>{const q=T(st.x,st.y), t=Math.hypot(px-q.x,py-q.y); if(t<d){d=t;best=i;}});
  if(d>18) return;
  judgeStar(best);
}
function judgeStar(i){
  const st=northStars()[i]; S.starIdx=i;
  if(st.pole){
    if(!S.seen.polaris){S.seen.polaris=1; addLog('북극성','하늘이 도는 중심');
      say('찾았습니다. 북극성입니다. 지구의 자전축이 이 별을 향하고 있어서, 밤새 하늘이 이 별을 중심으로 돌아갑니다. 이제 두 가지 찾는 방법을 확인해 보세요.','good');}
    checkNorth();
  }else{
    say('「'+st.n+'」은 시간이 지나면 자리를 옮깁니다. 「시간 흘려보내기」를 눌러 제자리에 남는 별을 찾아보세요.','warn');
  }
  draw();
}
function checkNorth(){
  if(S.seen.polaris&&S.guide.dOK&&S.guide.cOK&&!S.done[6]){
    finish(6,'북두칠성으로도, 카시오페아자리로도 같은 별에 닿았습니다. 두 별자리는 북극성을 사이에 두고 마주 보며 하루에 한 바퀴 돌지만, 북극성만은 제자리입니다 — 지구의 자전축이 그 방향을 가리키기 때문입니다.');}
}
function drawPhase(x,y,r,k,litRight,tint){
  sx.save();sx.translate(x,y);
  const gl=sx.createRadialGradient(0,0,r,0,0,r*2.6);
  gl.addColorStop(0,'rgba(235,240,255,.20)');gl.addColorStop(1,'rgba(235,240,255,0)');
  sx.fillStyle=gl;sx.beginPath();sx.arc(0,0,r*2.6,0,TAU);sx.fill();
  sx.fillStyle='#2A3145';sx.beginPath();sx.arc(0,0,r,0,TAU);sx.fill();
  sx.strokeStyle='rgba(200,212,238,.35)';sx.lineWidth=1;sx.beginPath();sx.arc(0,0,r,0,TAU);sx.stroke();
  if(moonReady){
    sx.save(); sx.beginPath(); sx.arc(0,0,r,0,TAU); sx.clip();
    sx.drawImage(moonImg,-r,-r,r*2,r*2);
    if(tint==='#8A3A2E'){sx.fillStyle='rgba(150,58,42,.55)';sx.fillRect(-r,-r,r*2,r*2);}  // 월식
    if(k<0.985){sx.fillStyle='rgba(6,10,20,.90)';phasePath(r,1-k,!litRight);sx.fill();}
    sx.restore();
  }else if(k>0.015){ sx.fillStyle=tint; phasePath(r,k,litRight); sx.fill(); }
  sx.restore();
}
function phasePath(r,k,litRight){
  const b=r*(1-2*k), sg=litRight?1:-1;
  sx.beginPath();
  sx.arc(0,0,r,-Math.PI/2,Math.PI/2,!litRight);
  sx.ellipse(0,0,Math.abs(b),r,0,Math.PI/2,-Math.PI/2,(b*sg>0));
  sx.closePath();
}

function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
  const A=p(a),B=p(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')';}

/* ---------------- 조작 ---------------- */
let drag=null;
function pos(e){const r=oc.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
oc.addEventListener('pointerdown',e=>{
  const p=pos(e); oc.setPointerCapture(e.pointerId);
  if(S.m===1){clickRing(p);draw();return;}
  if(S.m===2||S.m===6){const o=window.__eo;drag={mode:'spin',a:Math.atan2(o.ey-p.y,p.x-o.ex)*R2D,base:S.phi};}
  else if(S.m===3){const o=window.__eo;drag={mode:'orbit'};moveEarth(p);}
  else {const o=window.__em;drag={mode:'moon'};moveMoon(p);}
});
oc.addEventListener('pointermove',e=>{
  if(!drag)return; const p=pos(e);
  if(drag.mode==='spin'){const o=window.__eo;
    const a=Math.atan2(o.ey-p.y,p.x-o.ex)*R2D, d=sgn(a-drag.a);
    S.spinNet+=d; S.phi=norm(S.phi+d); drag.a=a; if(S.m===2)check2();}
  else if(drag.mode==='orbit') moveEarth(p);
  else moveMoon(p);
  draw();
});
addEventListener('pointerup',()=>{drag=null;});
function moveEarth(p){const o=window.__eo; const prev=S.thE;
  S.thE=norm(Math.atan2((o.cy-p.y)/TILT,p.x-o.cx)*R2D);
  S.phi=norm(S.phi+sgn(S.thE-prev)); // 공전하며 자전 위상 유지
}
function moveMoon(p){const o=window.__em;
  S.thM=norm(Math.atan2((o.cy-p.y)/TILT,p.x-o.cx)*R2D); check45();}
function clickRing(p){
  if(!S.pick)return; const R=window.__rings;
  const pr=Math.hypot(p.x-R.cx,(p.y-R.cy)/TILT);
  let best=-1,d=1e9; R.rings.forEach((r,i)=>{
    const dist=Math.abs(pr-r); if(dist<d){d=dist;best=i;}});
  if(d>22)return;
  for(const k in S.slots) if(S.slots[k]===S.pick) delete S.slots[k];
  S.slots[best]=S.pick; S.pick=null; check1(); render();
}
oc.addEventListener('keydown',e=>{
  const step=e.shiftKey?10:2; let used=true;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    const d=(e.key==='ArrowRight'?-step:step);
    if(S.m===2||S.m===6){S.spinNet+=d;S.phi=norm(S.phi+d);if(S.m===2)check2();}
    else if(S.m===3){const pv=S.thE;S.thE=norm(S.thE+d);S.phi=norm(S.phi+d);}
    else {S.thM=norm(S.thM+d);check45();}
  } else used=false;
  if(used){e.preventDefault();draw();}
});

/* ---------------- 판정 ---------------- */
function check1(){
  const all=PLANETS.every((p,i)=>S.slots[i]===p.k);
  if(all && !S.done[1] && S.scale==='real' && S.seen.classify){
    finish(1,'행성 8개를 제자리에 놓고, 실제 비율과 두 무리까지 확인했습니다. 해왕성은 화면 밖으로 밀려났죠 — 태양계는 대부분 빈 공간입니다.');}
  else if(all && S.scale==='real' && !S.seen.classify) say('실제 비율을 확인했습니다. 마지막으로 「🪨 표면으로 나누기」를 눌러 두 무리를 살펴보세요.','good');
  else if(all) say('배치는 모두 맞습니다. 이제 「실제 비율」을 켜 보세요.','good');
  else{
    const wrong=PLANETS.filter((p,i)=>S.slots[i]&&S.slots[i]!==p.k).length;
    if(wrong) say('제자리가 아닌 행성이 '+wrong+'개 있습니다. 주황색 테두리를 확인하세요.','warn');
    else say('좋습니다. 남은 행성을 계속 놓아 보세요.','');
  }
}
function check2(){
  const h=hourOf();
  if(S.spinNet<-70 && !S.warned){S.warned=true;
    say('하늘창을 보세요. 해가 서쪽에서 떠올라 동쪽으로 지고 있습니다. 지구는 반대로 돌고 있어요.','warn');}
  if(S.spinNet>-70 && S.warned && S.spinNet>20){S.warned=false;say('이제 해가 동쪽에서 뜹니다. 이 방향이 지구의 자전 방향입니다.','good');}
  if(!S.done[2] && Math.abs(h-18)<0.25 && S.spinNet>0){
    finish(2,'해질녘 18시. 태양이 서쪽 지평선에 걸렸습니다. 지구는 서쪽→동쪽(위에서 보면 반시계)으로 돌고, 그래서 해는 동쪽에서 떠 서쪽으로 집니다.');}
}
function check45(){
  if(S.m===5){
    const e=elong();
    if(Math.abs(e)<3 && !S.seen['일식']){S.seen['일식']=1;
      addLog('일식','달이 태양을 가림'); say('일식입니다. 달이 태양과 지구 사이에 들어와 태양을 가렸습니다 — 이때 달의 위상은 삭(신월)입니다.','good');}
    if(Math.abs(Math.abs(e)-180)<3 && !S.seen['월식']){S.seen['월식']=1;
      addLog('월식','달이 지구 그림자에 듦'); say('월식입니다. 지구가 태양과 달 사이에 들어와 그림자를 드리웠습니다 — 이때 달의 위상은 보름달입니다.','good');}
    if(S.seen['일식']&&S.seen['월식']&&!S.done[5]){
      finish(5,'두 가지 식을 모두 재현했습니다. 그런데 왜 매달 일어나지 않을까요? 달의 궤도가 지구 궤도면에 약 5° 기울어 있어, 삭과 보름마다 정확히 일직선이 되지는 않기 때문입니다.');}
  }
}
function record(){
  if(S.m===3){
    const s=seasonNow(), h=hourOf();
    if(Math.abs(sgn(s.deg-S.thE))>16){say('궤도 위 네 표시 지점 중 하나로 지구를 옮긴 뒤 기록하세요.','warn');return;}
    if(Math.abs(h-21)>1.2){say('계절 별자리는 그 계절 저녁 9시 무렵 남쪽 하늘에서 관찰합니다. 「저녁 9시」를 눌러 맞춰 보세요.','warn');return;}
    if(S.seen[s.s]){say(s.s+'은 이미 기록했습니다. 다른 지점으로 옮겨 보세요.','');return;}
    S.seen[s.s]=1; addLog(s.s+'철 별자리',s.trio.join(' · '));
    const n=['봄','여름','가을','겨울'].filter(x=>S.seen[x]).length;
    if(n===4) finish(3,'네 기록을 나란히 놓아 보세요. 별자리는 제자리인데 지구가 궤도 위 다른 자리에 있어, 계절마다 저녁 9시 남쪽 하늘에 다른 별자리가 옵니다. 한 계절 별자리는 초저녁 동쪽에서 떠올라 자정에는 서쪽으로 기울므로, 이웃한 두 계절에 걸쳐 보입니다.');
    else say(s.s+'철 별자리 '+s.trio.length+'개를 기록했습니다. 남은 계절 '+(4-n)+'개.','good');
  }else if(S.m===4){
    const e=elong(), idx=nextPhaseIdx(), target=PHASES[idx];
    if(!inBand(idx,e)){
      say('지금은 「'+phaseName()+'」입니다 (이각 '+Math.round(Math.abs(e))+'°). '+
          '목표는 「'+target.n+'」— 이각이 약 '+Math.abs(target.mid)+'° 가 되도록 달을 움직여 보세요.','warn');
      return;}
    S.seen['p'+idx]=1; addLog(target.n,'이각 '+Math.round(Math.abs(e))+'°');
    const n=[0,1,2,3,4,5,6,7].filter(i=>S.seen['p'+i]).length;
    if(n===8 && S.seen.maria) finish(4,'위상 8종과 달의 표면까지 살펴봤습니다. 밝은 면은 언제나 태양 쪽이었습니다 — 모양이 변한 이유는 그림자가 아니라, 달이 공전하며 우리가 밝은 면을 보는 각도가 달라졌기 때문입니다.');
    else if(n===8) say('위상 8종을 모두 만들었습니다. 마지막으로 「🔎 달 표면 살펴보기」로 달의 바다를 확인하세요.','good');
    else say('「'+target.n+'」 기록 완료. 다음 목표는 「'+PHASES[nextPhaseIdx()].n+'」입니다.','good');
  }
}
function nextPhaseIdx(){for(let i=0;i<8;i++)if(!S.seen['p'+i])return i;return 7;}
function award(n,why){
  S.score+=n;
  const pop=$('pop'); if(pop){pop.textContent='+'+n+' ⭐'+(why?' '+why:'');
    pop.classList.remove('go'); void pop.offsetWidth; pop.classList.add('go');}
  renderScore();
}
function levelOf(){let cur=LEVELS[0];for(const L of LEVELS) if(S.score>=L[0]) cur=L; return cur;}
function nextLevel(){for(const L of LEVELS) if(S.score<L[0]) return L; return null;}
function finish(n,msg){
  if(S.done[n]) return;
  S.done[n]=true; S.badges[n]=1;
  const bonus = S.clean[n]!==false ? 80 : 0;
  award(200+bonus, bonus?'완주 + 무실수':'임무 완주');
  say(BADGE[n]+' 배지 획득! '+msg+(bonus?' (한 번도 틀리지 않아 보너스 +80)':''),'good');
  render();
  if([1,2,3,4,5,6].every(i=>S.done[i])){
    say('여섯 임무를 모두 마쳤습니다. 아래 수료증에 이름을 적어 보세요.','good');
    const c=$('cert'); c.scrollIntoView({behavior:'smooth',block:'center'});
    setTimeout(()=>$('certName').focus(),400);
  }
}
function addLog(a,b){S.log.push({a,b}); S.records++; renderLog(); award(30,'관측 기록');}
function say(t,cls){
  if(cls==='warn') S.clean[S.m]=false;
  const f=$('fb');f.textContent=t;f.className='fb'+(cls?' '+cls:'');$('live').textContent=t;}
function renderScore(){
  const box=$('score'), L=levelOf(), N=nextLevel();
  const pct = N ? Math.round((S.score-L[0])/(N[0]-L[0])*100) : 100;
  box.innerHTML=
    '<span class="pts"><b>'+S.score.toLocaleString()+'</b><i>별가루</i></span>'+
    '<span class="lvl">'+L[2]+' <em>'+L[1]+'</em></span>'+
    '<span class="gauge"><i style="width:'+clamp(pct,4,100)+'%"></i></span>'+
    '<span class="lvl">'+(N?('다음 '+N[2]+' '+N[1]+'까지 '+(N[0]-S.score)):'최고 등급')+'</span>'+
    '<span class="badges">'+[1,2,3,4,5,6].map(i=>
      '<span class="'+(S.badges[i]?'got':'')+'" title="임무 0'+i+'">'+BADGE[i]+'</span>').join('')+'</span>'+
    '<span class="pop" id="pop"></span>';
}

  }else if(S.m===5){
    mk('달 한 바퀴 돌려보기',()=>{anim(()=>{S.thM=norm(S.thM+2);check45();},180);});

function anim(step,frames){let i=0;const f=()=>{step(i);draw();if(++i<frames)requestAnimationFrame(f);};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){for(let j=0;j<frames;j++)step(j);draw();}else f();}
function go(n){
  S.m=n; S.pick=null; S.spinNet=0; S.warned=false;
  if(n!==1) S.classify=false;
  if(n!==4) S.moonZoom=false;
  if(n===2){S.thE=0;S.phi=norm(sunDirFromEarth());}
  if(n===3){S.thE=0;S.seen={};setHour(21);}
  if(n===4){S.seen={};S.moonZoom=false;S.thE=0;S.thM=norm(sunDirFromEarth()+26);S.phi=norm(S.thE);}
  if(n===5){S.seen={};S.thE=0;S.thM=60;S.phi=norm(S.thE);}
  if(n===6){S.seen={};S.thE=0;S.phi=40;S.guide={d:false,c:false,dOK:false,cOK:false};S.starIdx=0;}
  if(S.clean[n]===undefined) S.clean[n]=true;
  S.log=[]; say(M[n].g.replace('목표 — ','이번 임무: '),'');
  render(); draw();
}

sc.addEventListener('pointerdown',e=>{
  if(S.m!==6)return;
  const r=sc.getBoundingClientRect(); pickStar(e.clientX-r.left,e.clientY-r.top);
});
sc.addEventListener('focus',()=>{S.starFocus=true;draw();});
sc.addEventListener('blur',()=>{S.starFocus=false;draw();});
sc.addEventListener('keydown',e=>{
  if(S.m!==6)return;
  const n=northStars().length;
  if(e.shiftKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){
    S.phi=norm(S.phi+(e.key==='ArrowRight'?-6:6));
  }else if(e.key==='ArrowRight'||e.key==='ArrowDown'){S.starIdx=(S.starIdx+1)%n;}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){S.starIdx=(S.starIdx+n-1)%n;}
  else if(e.key==='Enter'||e.key===' '){judgeStar(S.starIdx);}
  else return;
  e.preventDefault();draw();
});

$('certName').addEventListener('input',e=>{S.name=e.target.value;});
$('certPrint').onclick=()=>{
  if(!S.name.trim()){say('수료증에 넣을 이름을 먼저 적어 주세요.','warn');$('certName').focus();return;}
  $('certName').setAttribute('value',S.name);      // 인쇄 시에도 값이 남도록
  print();
};

$('theme').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
};
renderScore(); render(); fit();
</script>
